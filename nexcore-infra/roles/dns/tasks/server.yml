---
- name: Install BIND DNS Server packages
  dnf:
    name:
      - bind
      - bind-utils
    state: present

- name: Start and enable BIND service
  service:
    name: named
    state: started
    enabled: true

- name: Configure BIND configuration file (named.conf)
  template:
    src: named.conf.j2
    dest: /etc/named.conf
    owner: root
    group: named
    mode: '0640'
  notify: Restart BIND

- name: Create BIND master zone configuration directory
  file:
    path: /etc/named/zones/master
    state: directory
    owner: root
    group: named
    mode: '0750'

- name: Create nexcore.local zone file
  template:
    src: nexcore.local.j2
    dest: /etc/named/zones/master/nexcore.local
    owner: root
    group: named
    mode: '0640'
  notify: Restart BIND

- name: Create BIND /var master zone configuration directory
  file:
    path: /var/named/zones
    state: directory
    owner: root
    group: named
    mode: '0750'

- name: Create BIND /var master zone configuration directory
  file:
    path: /var/named/zones/master
    state: directory
    owner: root
    group: named
    mode: '0750'

- name: Create forward lookup zone file for nexcore.local
  template:
    src: nexcore.local.zone.j2
    dest: /var/named/zones/master/nexcore.local
    owner: root
    group: named
    mode: '0640'
  notify: Restart BIND
