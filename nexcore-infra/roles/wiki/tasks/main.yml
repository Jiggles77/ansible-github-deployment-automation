---
- name: Create deployment directory
  file:
    path: /var/www/mediawiki
    state: directory
    owner: nginx
    group: nginx

- name: Download and unpack MediaWiki distribution package
  unarchive:
    src: https://releases.wikimedia.org/mediawiki/1.41/mediawiki-1.41.0.tar.gz
    dest: "{{ wiki_install_dir }}"
    remote_src: true
    extra_opts: ["--strip-components=1"]
    creates: "{{ wiki_install_dir }}/index.php"
    owner: nginx
    group: nginx

- name: Create Nginx server configuration for MediaWiki
  template:
    src: wiki.nginx.conf.j2
    dest: /etc/nginx/conf.d/wiki.conf
  notify: Reload Nginx Server
