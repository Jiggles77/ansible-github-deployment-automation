---
- name: Create deployment directory for WordPress
  file:
    path: "{{ wp_install_dir }}"
    state: directory
    owner: nginx
    group: nginx
    mode: '0755'
    setype: httpd_sys_rw_content_t

- name: Download and unpack WordPress packages
  unarchive:
    src: https://wordpress.org/latest.tar.gz
    dest: "{{ wp_install_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ wp_install_dir }}/index.php"
    owner: nginx
    group: nginx

- name: Create Nginx configuration
  template:
    src: wordpress.nginx.conf.j2
    dest: /etc/nginx/conf.d/wordpress.conf
  notify: Reload Nginx Server

- name: Configure wp-config.php
  template:
    src: wp-config.php.j2
    dest: "{{ wp_install_dir }}/wp-config.php"

- name: Configure php-fpm for Nginx
  template:
    src: 99-www.conf.j2
    dest: /etc/php-fpm.d/99-www.conf
