---
- name: Install Postfix
  dnf:
    name:
      - postfix
      - dovecot
    state: present

- name: Start and Enable Dovecot
  service:
    name: dovecot
    state: started
    enabled: true

- name: Start and Enable Postfix
  service:
    name: postfix
    state: started
    enabled: true

- name: Deploy Postfix main.cf template
  template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    mode: '0644'
  notify: Restart Postfix

- name: Ensure local mailboxes exist for managed users
  file:
    path: "/var/spool/mail/{{ item.username }}"
    state: touch
    owner: "{{ item.username }}"
    group: mail
    mode: '0660'
  loop: "{{ managed_users }}"

- name: Deploy Dovecot configuration
  template:
    src: imap.conf.j2
    dest: /etc/dovecot/conf.d/imap.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart Dovecot

